<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glowMaskable" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGradMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#100e0d"/>
    </linearGradient>
    <linearGradient id="amberTextMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background Canvas for Safe Android Masking (Circle / Squircle) -->
  <rect width="512" height="512" fill="#0a0908" />
  <circle cx="256" cy="256" r="256" fill="url(#glowMaskable)" />

  <!-- Inner Content perfectly contained within safe zone (80% / ~409px circle) -->
  <!-- Scaled terminal icon inside safe zone -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#cardGradMaskable)" stroke="#d97706" stroke-opacity="0.75" stroke-width="7" />
  <rect x="106" y="106" width="300" height="300" rx="54" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2" />

  <g id="brand-symbol-maskable">
    <path d="M 176 200 L 246 256 L 176 312" fill="none" stroke="url(#amberTextMaskable)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="272" y1="312" x2="336" y2="312" stroke="url(#amberTextMaskable)" stroke-width="30" stroke-linecap="round" />
  </g>
</svg>
